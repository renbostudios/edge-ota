version: '3.8'

services:
  edge-ota-backend:
    image: ghcr.io/${IMAGE_OWNER}/edge-ota-backend:latest
    container_name: edge-ota-backend
    restart: always
    ports:
      - "127.0.0.1:3020:3000" # Localhost only; nginx proxies api.ota.renbo.site
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data/uploads:/app/apps/server-node/uploads
      - ./data/updates.db:/app/apps/server-node/updates.db

networks:
  default:
    name: edge-ota-net
    driver: bridge
